name: Build and Release The Unseen Hand

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          architecture: x64

      - name: Restore dependencies
        run: dotnet restore TheUnseenHand.sln -p:Platform=x64

      - name: Build solution
        run: >
          dotnet build TheUnseenHand.sln
          --configuration Release
          --no-restore
          -p:Platform=x64

      - name: Publish application
        run: >
          dotnet publish .\TheUnseenHand\TheUnseenHand.csproj
          --configuration Release
          --no-restore
          -p:Platform=x64
          --output .\artifacts\TheUnseenHand

      - name: Create release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: >
          Compress-Archive
          -Path .\artifacts\TheUnseenHand\*
          -DestinationPath .\artifacts\TheUnseenHand-windows-x64.zip

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: TheUnseenHand-windows-x64
          path: artifacts/TheUnseenHand/
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            .\artifacts\TheUnseenHand-windows-x64.zip `
            --verify-tag `
            --generate-notes `
            --title "The Unseen Hand $env:GITHUB_REF_NAME"
